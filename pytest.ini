[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Output and reporting (Windows compatibility)
addopts = -v --tb=short --strict-markers -s --disable-warnings
console_output_style = count

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    api: marks tests that require API to be running
    integration: marks tests that require full system integration
    unit: marks tests that test individual components
    regression: marks tests for regression prevention

# Test timeouts (if pytest-timeout is available)
timeout = 300
timeout_method = thread

# Minimum version requirements
minversion = 6.0

# Disable cacheprovider warnings
filterwarnings =
    ignore::pytest.PytestCacheWarning
    ignore::DeprecationWarning
    ignore::UserWarning:haystack*